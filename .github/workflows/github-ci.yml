name: CI - Tests

on:
  push: 
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

  steps:
  - name: Checkout Code
    uses: actions/checkout/@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20' 
      cache: 'npm'

  - name: Install Dependencies 
    uses: npm ci 

  - name: Run Linter 
    uses: npm run lint 

  - name: Run Tests 
    uses: npm run test:run 

  - name: Build 
    run: npm run build
